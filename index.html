    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="brand">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <!-- Nanti ganti src ini dengan file logo-ma.png yang sudah Anda siapkan -->
                    <img src="assets/logo-ma.png" alt="Logo MA As'adiyah" class="logo-madrasah" onerror="this.src='https://via.placeholder.com/50x50/10b981/ffffff?text=MA'">
                    <div>
                        <h1><i class="fas fa-award"></i> PKKM Digital</h1>
                        <p>MA. As'adiyah Ereng-Ereng | Yayasan Pendidikan As'adiyah</p>
                    </div>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <div id="guestBadge" style="background: #f1f5f9; color: #64748b; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;">
                    <i class="fas fa-eye"></i> Mode Tamu
                </div>
                <div id="userInfo" style="display: none; text-align: right;">
                    <div id="userName" style="font-weight: 700; color: #0f172a; font-size: 0.9rem;">-</div>
                    <div id="userRole" style="font-size: 0.75rem; color: #0891b2; text-transform: uppercase;">-</div>
                </div>
                
                <button id="btnLogin" class="btn btn-primary" onclick="openLoginModal()" style="padding: 8px 16px;">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button id="btnLogout" class="btn btn-secondary" onclick="logout()" style="display: none; padding: 8px 16px;">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
            </div>
        </div>
    </div>
